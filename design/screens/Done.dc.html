<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>InstaDelete — Moved to Bin</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0062CC}a:hover{color:#004A9E}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; box-sizing: border-box; display: flex; background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, 'Helvetica Neue', sans-serif; color: #1D1D1F; border: 1px solid #D2D2D7; border-radius: 12px; overflow: hidden">
  <nav aria-label="Sidebar" style="width: 230px; flex-shrink: 0; background: #F2F2F4; border-right: 1px solid #E2E2E6; display: flex; flex-direction: column; padding: 0 10px 16px; box-sizing: border-box">
    <div style="height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 8px">
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57; box-sizing: border-box; border: 1px solid #E0443E"></span>
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E; box-sizing: border-box; border: 1px solid #DEA123"></span>
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #28C840; box-sizing: border-box; border: 1px solid #1AAB29"></span>
    </div>
    <div style="font-size: 11px; font-weight: 600; color: #6E6E73; padding: 12px 10px 6px">Library</div>
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
      <a href="Gallery.dc.html" style="display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 6px; text-decoration: none; color: #1D1D1F; font-size: 13px; {{n.bg}}">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0062CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        <span style="flex: 1">{{n.label}}</span>
        <span style="color: #6E6E73; font-size: 12px; font-variant-numeric: tabular-nums">{{n.count}}</span>
      </a>
    </sc-for>
    <div style="font-size: 11px; font-weight: 600; color: #6E6E73; padding: 18px 10px 6px">Review</div>
    <a href="BinList.dc.html" style="display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 6px; text-decoration: none; color: #1D1D1F; font-size: 13px">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E6E73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"></path><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"></path><path d="M9 7V4h6v3"></path></svg>
      <span style="flex: 1">To Be Binned</span>
      <span style="color: #6E6E73; font-size: 12px">0</span>
    </a>
  </nav>

  <main style="flex: 1; min-width: 0; display: flex; flex-direction: column">
    <div style="height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 20px; border-bottom: 1px solid #E5E5EA">
      <div style="display: flex; align-items: baseline; gap: 10px; flex: 1">
        <h1 style="margin: 0; font-size: 15px; font-weight: 700">All Images</h1>
        <span style="font-size: 12px; color: #6E6E73">2,474 images</span>
      </div>
      <a href="Review.dc.html" style="display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 14px; box-sizing: border-box; border-radius: 7px; background: #0062CC; color: #FFFFFF; font-size: 13px; font-weight: 600; text-decoration: none">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"></path></svg>
        Start Slideshow Review
      </a>
    </div>
    <div aria-hidden="true" style="flex: 1; min-height: 0; overflow: hidden; padding: 16px 20px 20px">
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{thumbs}}" as="c" hint-placeholder-count="24">
          <div style="aspect-ratio: 1 / 1; border-radius: 6px; background: {{c}}"></div>
        </sc-for>
      </div>
    </div>
  </main>

  <div role="status" style="position: absolute; left: 50%; bottom: 32px; transform: translateX(-50%) translateX(115px); width: 560px; box-sizing: border-box; padding: 14px 16px; border-radius: 14px; background: #1D1D1F; color: #F5F5F7; display: flex; align-items: center; gap: 14px; box-shadow: 0 16px 40px rgba(0,0,0,0.3)">
    <div style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; background: #13351E; color: #4ADE80; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 14px; font-weight: 600">12 images moved to the Bin</div>
      <div style="font-size: 12px; color: #A1A1A6">48.6 MB · Put them back any time from the Bin in Finder</div>
    </div>
    <a href="BinList.dc.html" style="display: flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 7px; background: #2E2E33; color: #F5F5F7; font-size: 13px; font-weight: 500; text-decoration: none">Undo</a>
    <a href="Done.dc.html" style="display: flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 7px; background: #F5F5F7; color: #1D1D1F; font-size: 13px; font-weight: 600; text-decoration: none">Show in Bin</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const colors = ['#C9D6DF','#E8D5B7','#B8C4A9','#D4B8B0','#A9B8C9','#E3CFC1','#BFCFC4','#CBBFD6','#D9C9A8','#AFC3C9','#D8C3C9','#B5C7B9'];
    const thumbs = [];
    for (let i = 0; i < 30; i++) thumbs.push(colors[(i * 7 + 2) % colors.length]);
    return {
      thumbs,
      nav: [
        { label: 'All Images', count: '2,474', bg: 'background: #DCDCE2; font-weight: 600' },
        { label: 'Pictures', count: '1,897', bg: '' },
        { label: 'Desktop', count: '210', bg: '' },
        { label: 'Downloads', count: '315', bg: '' },
        { label: 'Documents', count: '52', bg: '' }
      ]
    };
  }
}
</script>
</body>
</html>
