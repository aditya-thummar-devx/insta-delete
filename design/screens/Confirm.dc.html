<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>InstaDelete — Confirm move to Bin</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0062CC}a:hover{color:#004A9E}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, 'Helvetica Neue', sans-serif; color: #1D1D1F; border: 1px solid #D2D2D7; border-radius: 12px; overflow: hidden">
  <div aria-hidden="true" style="height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 18px; border-bottom: 1px solid #E5E5EA; background: #F6F6F8">
    <span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57"></span>
    <span style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E"></span>
    <span style="width: 12px; height: 12px; border-radius: 50%; background: #28C840"></span>
    <div style="flex: 1; text-align: center; font-size: 13px; font-weight: 600; color: #3A3A3C; margin-right: 52px">To Be Binned</div>
  </div>
  <div aria-hidden="true" style="flex: 1; padding: 24px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; align-content: start">
    <sc-for list="{{bg}}" as="c" hint-placeholder-count="12">
      <div style="aspect-ratio: 1 / 1; border-radius: 6px; background: {{c}}; box-shadow: 0 0 0 3px #D70015"></div>
    </sc-for>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.32); display: flex; align-items: center; justify-content: center">
    <div role="alertdialog" aria-labelledby="confirm-title" style="width: 380px; box-sizing: border-box; padding: 24px 20px 18px; border-radius: 14px; background: #ECECEE; box-shadow: 0 24px 60px rgba(0,0,0,0.35), 0 0 0 1px rgba(0,0,0,0.08); display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
      <div style="width: 64px; height: 64px; border-radius: 15px; background: #0062CC; color: #FFFFFF; display: flex; align-items: center; justify-content: center; position: relative">
        <svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="15" height="13" rx="2"></rect><path d="M3 7v11a2 2 0 0 0 2 2h11"></path><circle cx="11" cy="7.5" r="1.5"></circle><path d="M21 13l-4-4-6 6"></path></svg>
        <div style="position: absolute; right: -8px; bottom: -8px; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; color: #C4161C; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,0.25)">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"></path><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"></path><path d="M9 7V4h6v3"></path></svg>
        </div>
      </div>
      <h2 id="confirm-title" style="margin: 6px 0 0; font-size: 15px; font-weight: 700">Move 12 images to the Bin?</h2>
      <p style="margin: 0; font-size: 13px; line-height: 1.45; color: #3A3A3C">They’ll go to the Bin in Finder (48.6 MB). You can put them back until you empty the Bin. InstaDelete never deletes anything.</p>
      <p style="margin: 0; font-size: 12px; line-height: 1.45; color: #5A5A5F">Next, macOS will ask for Touch ID or your password.</p>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; width: 100%; margin-top: 4px">
        <a href="BinList.dc.html" style="display: flex; align-items: center; justify-content: center; height: 32px; border-radius: 7px; background: #FFFFFF; color: #1D1D1F; font-size: 13px; font-weight: 500; text-decoration: none; box-shadow: 0 0 0 1px rgba(0,0,0,0.1)">Cancel</a>
        <a href="Auth.dc.html" style="display: flex; align-items: center; justify-content: center; height: 32px; border-radius: 7px; background: #C4161C; color: #FFFFFF; font-size: 13px; font-weight: 600; text-decoration: none">Move to Bin</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return { bg: ['#D4B8B0','#A9B8C9','#E8D5B7','#CBBFD6','#B8C4A9','#D9C9A8','#C9D6DF','#E3CFC1','#AFC3C9','#D8C3C9','#BFCFC4','#B5C7B9'] };
  }
}
</script>
</body>
</html>
