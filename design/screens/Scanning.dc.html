<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>InstaDelete — Scanning</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0062CC}a:hover{color:#004A9E}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, 'Helvetica Neue', sans-serif; color: #1D1D1F; border: 1px solid #D2D2D7; border-radius: 12px; overflow: hidden">
  <div style="height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 18px; border-bottom: 1px solid #E5E5EA; background: #F6F6F8">
    <span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57; box-sizing: border-box; border: 1px solid #E0443E"></span>
    <span style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E; box-sizing: border-box; border: 1px solid #DEA123"></span>
    <span style="width: 12px; height: 12px; border-radius: 50%; background: #28C840; box-sizing: border-box; border: 1px solid #1AAB29"></span>
    <div style="flex: 1; text-align: center; font-size: 13px; font-weight: 600; color: #3A3A3C; margin-right: 52px">InstaDelete</div>
  </div>

  <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px">
    <div style="width: 600px; display: flex; flex-direction: column; gap: 28px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="font-size: 13px; font-weight: 600; color: #0062CC; text-transform: uppercase; letter-spacing: 0.6px">Scanning</div>
        <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.3px">Looking for images in your Home folder…</h1>
        <p style="margin: 0; font-size: 14px; color: #6E6E73">System folders, app bundles and caches are skipped.</p>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <div style="font-size: 40px; font-weight: 700; letter-spacing: -0.8px; font-variant-numeric: tabular-nums">1,544 <span style="font-size: 16px; font-weight: 500; color: #6E6E73; letter-spacing: 0">images found</span></div>
          <div style="font-size: 14px; color: #6E6E73; font-variant-numeric: tabular-nums">62%</div>
        </div>
        <div role="progressbar" aria-label="Scan progress" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100" style="height: 8px; border-radius: 4px; background: #E5E5EA; overflow: hidden">
          <div style="width: 62%; height: 100%; border-radius: 4px; background: #0062CC"></div>
        </div>
        <div style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; color: #6E6E73; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">~/Downloads/Trip photos/IMG_4821.HEIC</div>
      </div>

      <div style="border: 1px solid #E5E5EA; border-radius: 12px; overflow: hidden">
        <sc-for list="{{folders}}" as="f" hint-placeholder-count="5">
          <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #F0F0F3; font-size: 14px">
            <sc-if value="{{f.done}}" hint-placeholder-val="{{ true }}">
              <svg role="img" aria-label="Done" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E7B34" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M8 12l3 3 5-6"></path></svg>
            </sc-if>
            <sc-if value="{{f.active}}" hint-placeholder-val="{{ false }}">
              <svg role="img" aria-label="Scanning" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0062CC" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.2-8.6"></path></svg>
            </sc-if>
            <sc-if value="{{f.waiting}}" hint-placeholder-val="{{ false }}">
              <svg role="img" aria-label="Waiting" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#AEAEB2" stroke-width="2"><circle cx="12" cy="12" r="9"></circle></svg>
            </sc-if>
            <div style="flex: 1; font-weight: 500">{{f.name}}</div>
            <div style="color: #6E6E73; font-variant-numeric: tabular-nums">{{f.count}}</div>
          </div>
        </sc-for>
      </div>

      <div style="display: flex; gap: 12px; justify-content: flex-end">
        <a href="Main.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 20px; box-sizing: border-box; border-radius: 10px; border: 1px solid #D2D2D7; background: #FFFFFF; color: #1D1D1F; font-size: 14px; font-weight: 500; text-decoration: none">Stop Scan</a>
        <a href="Gallery.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 20px; box-sizing: border-box; border-radius: 10px; background: #0062CC; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none">Show Images Found So Far</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const row = (name, count, s) => ({ name, count, done: s === 'done', active: s === 'active', waiting: s === 'wait' });
    return {
      folders: [
        row('Pictures', '1,014 found', 'done'),
        row('Desktop', '212 found', 'done'),
        row('Downloads', '318 found so far', 'active'),
        row('Documents', 'Waiting', 'wait'),
        row('Other folders in Home', 'Waiting', 'wait')
      ]
    };
  }
}
</script>
</body>
</html>
