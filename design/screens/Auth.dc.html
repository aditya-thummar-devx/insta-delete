<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>InstaDelete — Authenticate</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0062CC}a:hover{color:#004A9E}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, 'Helvetica Neue', sans-serif; color: #1D1D1F; border: 1px solid #D2D2D7; border-radius: 12px; overflow: hidden">
  <div aria-hidden="true" style="height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 18px; border-bottom: 1px solid #E5E5EA; background: #F6F6F8">
    <span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57"></span>
    <span style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E"></span>
    <span style="width: 12px; height: 12px; border-radius: 50%; background: #28C840"></span>
    <div style="flex: 1; text-align: center; font-size: 13px; font-weight: 600; color: #3A3A3C; margin-right: 52px">To Be Binned</div>
  </div>
  <div aria-hidden="true" style="flex: 1; padding: 24px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; align-content: start">
    <sc-for list="{{bg}}" as="c" hint-placeholder-count="12">
      <div style="aspect-ratio: 1 / 1; border-radius: 6px; background: {{c}}; box-shadow: 0 0 0 3px #D70015"></div>
    </sc-for>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.32); display: flex; align-items: center; justify-content: center">
    <div role="dialog" aria-labelledby="auth-title" style="width: 340px; box-sizing: border-box; padding: 26px 20px 18px; border-radius: 14px; background: #ECECEE; box-shadow: 0 24px 60px rgba(0,0,0,0.35), 0 0 0 1px rgba(0,0,0,0.08); display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
      <sc-if value="{{touch}}" hint-placeholder-val="{{ true }}">
        <a href="Done.dc.html" aria-label="Touch ID sensor — click to approve in this prototype" style="width: 72px; height: 72px; border-radius: 50%; background: #FFFFFF; color: #E0244B; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 1px rgba(0,0,0,0.06)">
          <svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 8.5a6 6 0 0 1 11 3.5v1"></path><path d="M9 11.5a3 3 0 0 1 6 .5v2.5a8 8 0 0 0 1 4"></path><path d="M12 12v3a10 10 0 0 0 1.5 5"></path><path d="M5.5 12.5v1a9 9 0 0 0 1.5 5"></path><path d="M8.5 15a10 10 0 0 0 1.5 5.5"></path><path d="M4.5 6.5A8.5 8.5 0 0 1 19 7"></path></svg>
        </a>
      </sc-if>
      <h2 id="auth-title" style="margin: 4px 0 0; font-size: 15px; font-weight: 700">InstaDelete</h2>
      <p style="margin: 0; font-size: 13px; line-height: 1.45; color: #3A3A3C">InstaDelete wants to move 12 images to the Bin.</p>
      <sc-if value="{{touch}}" hint-placeholder-val="{{ true }}">
        <p style="margin: 0; font-size: 13px; line-height: 1.45; color: #3A3A3C">Touch ID or enter your password to allow this.</p>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; width: 100%; margin-top: 6px">
          <button type="button" onClick="{{usePassword}}" style="height: 32px; border: 0; border-radius: 7px; background: #FFFFFF; color: #1D1D1F; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; box-shadow: 0 0 0 1px rgba(0,0,0,0.1)">Use Password…</button>
          <a href="BinList.dc.html" style="display: flex; align-items: center; justify-content: center; height: 32px; border-radius: 7px; background: #FFFFFF; color: #1D1D1F; font-size: 13px; font-weight: 500; text-decoration: none; box-shadow: 0 0 0 1px rgba(0,0,0,0.1)">Cancel</a>
        </div>
      </sc-if>
      <sc-if value="{{password}}" hint-placeholder-val="{{ false }}">
        <p style="margin: 0; font-size: 13px; line-height: 1.45; color: #3A3A3C">Enter your password to allow this.</p>
        <label style="width: 100%; display: flex; flex-direction: column; gap: 4px; text-align: left; font-size: 12px; color: #3A3A3C">
          Password
          <input type="password" aria-label="Password" style="height: 30px; box-sizing: border-box; padding: 0 8px; border-radius: 6px; border: 1px solid #C7C7CC; background: #FFFFFF; font: inherit; font-size: 13px; outline: 3px solid rgba(0, 98, 204, 0.35); outline-offset: 0">
        </label>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; width: 100%; margin-top: 4px">
          <a href="BinList.dc.html" style="display: flex; align-items: center; justify-content: center; height: 32px; border-radius: 7px; background: #FFFFFF; color: #1D1D1F; font-size: 13px; font-weight: 500; text-decoration: none; box-shadow: 0 0 0 1px rgba(0,0,0,0.1)">Cancel</a>
          <a href="Done.dc.html" style="display: flex; align-items: center; justify-content: center; height: 32px; border-radius: 7px; background: #0062CC; color: #FFFFFF; font-size: 13px; font-weight: 600; text-decoration: none">Allow</a>
        </div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'touch' };
  }
  renderVals() {
    return {
      touch: this.state.mode === 'touch',
      password: this.state.mode === 'password',
      usePassword: () => this.setState({ mode: 'password' }),
      bg: ['#D4B8B0','#A9B8C9','#E8D5B7','#CBBFD6','#B8C4A9','#D9C9A8','#C9D6DF','#E3CFC1','#AFC3C9','#D8C3C9','#BFCFC4','#B5C7B9']
    };
  }
}
</script>
</body>
</html>
