<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E8BFF"/>
      <stop offset="1" stop-color="#004FC4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF4B57"/>
      <stop offset="1" stop-color="#D1132A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#00163D" flood-opacity="0.35"/>
    </filter>
    <clipPath id="photo">
      <rect x="300" y="330" width="424" height="300" rx="20"/>
    </clipPath>
  </defs>

  <!-- macOS icon body: 824x824 on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>

  <!-- back card: video -->
  <g transform="rotate(-10 420 400)" filter="url(#cardShadow)">
    <rect x="200" y="235" width="440" height="320" rx="34" fill="#0B2E66"/>
    <circle cx="335" cy="345" r="62" fill="#FFFFFF" fill-opacity="0.16"/>
    <path d="M313 312 L313 378 L370 345 Z" fill="#FFFFFF"/>
  </g>

  <!-- front card: photo -->
  <g transform="translate(78 78) rotate(7 512 480) translate(512 480) scale(0.86) translate(-512 -480)" filter="url(#cardShadow)">
    <rect x="272" y="302" width="480" height="356" rx="36" fill="#FFFFFF"/>
    <g clip-path="url(#photo)">
      <rect x="300" y="330" width="424" height="300" fill="#CFE4FB"/>
      <circle cx="636" cy="410" r="38" fill="#FFC23D"/>
      <path d="M300 590 L410 480 L490 545 L590 440 L724 575 L724 630 L300 630 Z" fill="#5E9BE0"/>
      <path d="M300 630 L300 610 L380 560 L470 610 L560 570 L724 630 Z" fill="#3D7FCC"/>
    </g>
  </g>

  <!-- trash badge -->
  <circle cx="728" cy="728" r="132" fill="#FFFFFF"/>
  <circle cx="728" cy="728" r="113" fill="url(#badge)"/>
  <g transform="translate(636 636) scale(7.67)" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 7h16"/>
    <path d="M10 11v6M14 11v6"/>
    <path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/>
    <path d="M9 7V4h6v3"/>
  </g>
</svg>
