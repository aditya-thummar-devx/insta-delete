name: InstaDelete
options:
  bundleIdPrefix: com.instadelete
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Releases override both (scripts/make-dmg.sh): Sparkle compares the build number, which release.sh sets to the commit count.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # No signing, and never automatic: no team, no identity, no provisioning.
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # Pinned exactly: the xcodeproj is gitignored, so there is no Package.resolved. Same version as my-work-dock.
    exactVersion: 2.10.0
targets:
  InstaDelete:
    type: application
    platform: macOS
    sources:
      - Sources/InstaDelete
      - Resources/Assets.xcassets
    dependencies:
      - package: Sparkle
    # Sparkle OTA: appcast.xml is attached to every GitHub release; installed copies verify updates against SUPublicEDKey (the
    # private key lives in the login Keychain, account insta-delete, and in the CI secret SPARKLE_ED_PRIVATE_KEY). Custom keys
    # can't go through INFOPLIST_KEY_*, so XcodeGen writes this partial plist and Xcode merges the generated keys into it.
    # Hourly check, silent download, installed when the user quits. Set here, not in code: it also skips Sparkle's "check automatically?" prompt.
    # ponytail: unsigned + unsandboxed (entitlements aren't embedded), so nothing else is needed. If signing and the sandbox come back, add
    # SUEnableInstallerLauncherService, com.apple.security.network.client and mach-lookup exceptions for <bundle id>-spks / -spki.
    info:
      path: Sources/InstaDelete/App/Info.plist
      properties:
        SUFeedURL: https://github.com/aditya-thummar-devx/insta-delete/releases/latest/download/appcast.xml
        SUPublicEDKey: 6dVdF8iOC4G02xFIPKw17wIxR5hSrHtZSFfnacAb4Q0=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 3600
    entitlements:
      path: Sources/InstaDelete/App/InstaDelete.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.instadelete.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: InstaDelete
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  InstaDeleteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/InstaDeleteTests
    dependencies:
      - target: InstaDelete
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.instadelete.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  InstaDelete:
    build:
      targets:
        InstaDelete: all
    test:
      targets:
        - InstaDeleteTests
