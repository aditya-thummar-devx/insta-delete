name: InstaDelete
options:
  bundleIdPrefix: com.instadelete
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # No signing, and never automatic: no team, no identity, no provisioning.
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
targets:
  InstaDelete:
    type: application
    platform: macOS
    sources:
      - Sources/InstaDelete
      - Resources/Assets.xcassets
    entitlements:
      path: Sources/InstaDelete/App/InstaDelete.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.instadelete.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: InstaDelete
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  InstaDeleteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/InstaDeleteTests
    dependencies:
      - target: InstaDelete
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.instadelete.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  InstaDelete:
    build:
      targets:
        InstaDelete: all
    test:
      targets:
        - InstaDeleteTests
